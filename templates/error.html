{% extends "base.html" %}

{% block title %}Error {{ error_code }} | Resume Studio{% endblock %}

{% block content %}
<section class="py-12 sm:py-16 flex items-center justify-center min-h-[60vh] bg-[#EDEBE7]">
  <div class="max-w-lg w-full mx-auto px-4 text-center">
    
    <div class="bg-[#EDEBE7] text-[#25262E] rounded-lg border border-[#434451] shadow-xs p-6 sm:p-8 space-y-5">
      
      <div class="w-12 h-12 rounded-lg bg-[#DFDCD5] text-[#434451] flex items-center justify-center text-2xl mx-auto border border-[#434451]">
        <i class="bi bi-exclamation-triangle"></i>
      </div>

      <div>
        <span class="inline-block px-2.5 py-0.5 rounded-md bg-[#DFDCD5] border border-[#434451] text-[#626372] text-xs font-bold uppercase tracking-wider mb-2">
          Error {{ error_code }}
        </span>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#25262E]">
          Something Needs Attention
        </h1>
        <p class="text-xs sm:text-sm text-[#626372] mt-2 leading-relaxed font-medium">
          {{ error_message }}
        </p>
      </div>

      <div class="pt-2">
        <a href="{{ url_for('main.index') }}" class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-lg font-bold text-sm text-[#EDEBE7] bg-[#434451] hover:bg-[#25262E] shadow-xs transition-all">
          <i class="bi bi-house-door"></i> Return to Dashboard
        </a>
      </div>

    </div>

  </div>
</section>
{% endblock %}
